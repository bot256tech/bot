limit_req_zone $binary_remote_addr zone=agrichain_general:10m rate=30r/s;

upstream agrichain_app { server 127.0.0.1:3000; }

# HTTP → HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 16.192.159.6;
    return 301 https://$host$request_uri;
}

# HTTPS — Let's Encrypt certificate for the IP address
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name 16.192.159.6;

    ssl_certificate     /etc/nginx/ssl/agrichain.crt;
    ssl_certificate_key /etc/nginx/ssl/agrichain.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        limit_req zone=agrichain_general burst=25 nodelay;
        proxy_pass http://agrichain_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    client_max_body_size 10m;
    access_log /var/log/nginx/agrichain.access.log;
    error_log  /var/log/nginx/agrichain.error.log;
}
